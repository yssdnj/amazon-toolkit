<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0f0f0f;
  --bg-2:      #181818;
  --bg-3:      #222222;
  --border:    #2e2e2e;
  --border-hi: #444;
  --text:      #e8e8e8;
  --text-2:    #888;
  --text-3:    #555;
  --accent:    #d4a843;
  --accent-dim:#8a6c28;
  --ok:        #4caf6e;
  --ok-dim:    #1e3d2a;
  --err:       #e05c5c;
  --err-dim:   #3d1e1e;
  --info:      #5b9cf6;
  --info-dim:  #1a2e4a;
  --warn:      #e0963a;
  --font-ui:   'Sora', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --radius:    8px;
  --radius-lg: 12px;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.6; }

/* ── Layout ─────────────────────────────── */
.shell { display: grid; grid-template-rows: 52px 1fr; height: 100vh; }

.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-2);
}
.topbar-logo { display: flex; align-items: center; gap: 8px; }
.topbar-logo-box {
  width: 26px; height: 26px; background: var(--accent);
  border-radius: 5px; display: flex; align-items: center; justify-content: center;
}
.topbar-logo-box svg { width: 14px; height: 14px; fill: #000; }
.topbar-name { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
.topbar-version { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
.topbar-spacer { flex: 1; }
.topbar-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

.body { display: grid; grid-template-columns: 240px 1fr; overflow: hidden; }

/* ── Sidebar ─────────────────────────────── */
.sidebar { border-right: 1px solid var(--border); overflow-y: auto; padding: 20px 0; }
.sidebar-section { padding: 0 16px; margin-bottom: 24px; }
.sidebar-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; padding: 0 4px; }

.tool-btn {
  display: flex; align-items: flex-start; gap: 10px;
  width: 100%; padding: 10px 12px; border-radius: var(--radius);
  border: 1px solid transparent; background: none;
  cursor: pointer; text-align: left; transition: all 0.15s;
  color: var(--text-2);
}
.tool-btn:hover { background: var(--bg-3); border-color: var(--border); color: var(--text); }
.tool-btn.active { background: var(--bg-3); border-color: var(--accent-dim); color: var(--text); }
.tool-btn.active .tool-num { color: var(--accent); }

.tool-num { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); min-width: 18px; padding-top: 1px; }
.tool-info { flex: 1; min-width: 0; }
.tool-name { font-size: 13px; font-weight: 500; }
.tool-short { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

.dep-tag {
  font-size: 10px; color: var(--accent-dim); font-family: var(--font-mono);
  padding: 2px 6px; border: 1px solid var(--accent-dim); border-radius: 3px;
  margin-top: 6px; display: inline-block;
}

.sidebar-divider { height: 1px; background: var(--border); margin: 8px 16px 20px; }

/* ── Main panel ──────────────────────────── */
.main { display: grid; grid-template-rows: 1fr 280px; overflow: hidden; }

.panel { padding: 28px 32px; overflow-y: auto; }

.panel-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; color: var(--text); margin-bottom: 4px; }
.panel-desc { font-size: 13px; color: var(--text-2); margin-bottom: 24px; }

.note-bar {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--info-dim); border: 1px solid var(--info);
  border-radius: var(--radius); padding: 10px 14px;
  font-size: 12px; color: var(--info); margin-bottom: 24px;
  opacity: 0.85;
}
.note-bar svg { flex-shrink: 0; margin-top: 1px; }

/* Files area */
.section-head { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }

.files-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }

.file-zone {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
}
.file-zone-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.file-zone-label { font-size: 11px; font-weight: 500; color: var(--text-2); letter-spacing: 0.05em; text-transform: uppercase; }
.file-zone-body { padding: 8px; min-height: 80px; }

.file-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 5px;
  font-size: 12px; font-family: var(--font-mono); color: var(--text-2);
  transition: background 0.1s;
}
.file-row:hover { background: var(--bg-3); }
.file-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.file-row-size { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
.file-row-del {
  width: 18px; height: 18px; border-radius: 3px; border: none; background: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); opacity: 0; transition: opacity 0.1s;
}
.file-row:hover .file-row-del { opacity: 1; }
.file-row-del:hover { color: var(--err); background: var(--err-dim); }
.file-row-dl {
  width: 18px; height: 18px; border-radius: 3px; border: none; background: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); opacity: 0; transition: opacity 0.1s;
}
.file-row:hover .file-row-dl { opacity: 1; }
.file-row-dl:hover { color: var(--ok); }

.file-empty { padding: 20px 8px; text-align: center; font-size: 12px; color: var(--text-3); }

/* Upload drop */
.upload-drop {
  border: 1px dashed var(--border-hi); border-radius: 6px;
  margin: 8px; padding: 14px;
  text-align: center; font-size: 12px; color: var(--text-3);
  cursor: pointer; transition: all 0.15s;
}
.upload-drop:hover, .upload-drop.over { border-color: var(--accent); color: var(--accent); background: rgba(212,168,67,.05); }
.upload-drop input { display: none; }

/* Params */
.params-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.param-group { display: flex; flex-direction: column; gap: 4px; }
.param-label { font-size: 11px; font-weight: 500; color: var(--text-2); letter-spacing: 0.05em; text-transform: uppercase; }
.param-input {
  background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--font-mono); font-size: 13px;
  padding: 7px 12px; border-radius: var(--radius); outline: none;
  transition: border-color 0.15s; width: 160px;
}
.param-input:focus { border-color: var(--accent); }
.param-input::placeholder { color: var(--text-3); }

/* Run button */
.btn-run {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 22px; border-radius: var(--radius);
  border: none; background: var(--accent); color: #000;
  font-family: var(--font-ui); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; letter-spacing: 0.02em;
}
.btn-run:hover { background: #e8b94f; }
.btn-run:active { transform: scale(0.98); }
.btn-run:disabled { background: var(--bg-3); color: var(--text-3); cursor: not-allowed; transform: none; }

.btn-run .spin {
  width: 13px; height: 13px; border: 2px solid rgba(0,0,0,0.3);
  border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
}
.btn-run.loading .spin { display: block; }
.btn-run.loading .run-icon { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Terminal ─────────────────────────────── */
.terminal {
  border-top: 1px solid var(--border); background: #0a0a0a;
  display: flex; flex-direction: column;
}
.terminal-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg-2); flex-shrink: 0;
}
.terminal-dots { display: flex; gap: 5px; }
.terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #e05c5c; }
.dot-y { background: var(--accent); }
.dot-g { background: var(--ok); }
.terminal-title { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); flex: 1; }
.terminal-clear { font-size: 11px; color: var(--text-3); background: none; border: none; cursor: pointer; font-family: var(--font-ui); padding: 2px 8px; border-radius: 4px; }
.terminal-clear:hover { background: var(--bg-3); color: var(--text-2); }

.terminal-body {
  flex: 1; overflow-y: auto; padding: 14px 16px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.9;
}

.log-line { display: flex; gap: 12px; }
.log-ts { color: var(--text-3); flex-shrink: 0; user-select: none; }
.log-msg { color: var(--text-2); word-break: break-all; }
.log-msg.ok   { color: var(--ok); }
.log-msg.err  { color: var(--err); }
.log-msg.warn { color: var(--warn); }
.log-msg.info { color: var(--info); }
.log-prompt { color: var(--text-3); }
.log-cursor { display: inline-block; width: 7px; height: 13px; background: var(--accent); vertical-align: middle; animation: blink 1s step-end infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }

.welcome-msg { color: var(--text-3); font-size: 12px; padding: 8px 0; }
.welcome-msg span { color: var(--accent); }

/* scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 99px; }

/* empty state */
.empty-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--text-3); }
.empty-panel svg { opacity: 0.3; }
.empty-panel p { font-size: 13px; }
</style>
</head>
<body>

<div class="shell">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-logo-box">
        <svg viewBox="0 0 14 14"><path d="M1 2h12v2H1V2zm0 4h8v2H1V6zm0 4h10v2H1v-2z"/></svg>
      </div>
      <span class="topbar-name">Amazon Toolkit</span>
      <span class="topbar-version">v2.0</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">服务运行中</span>
    </div>
  </div>

  <!-- Body -->
  <div class="body">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">周报流程</div>
        <div id="tool-list-weekly"></div>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section">
        <div class="sidebar-label">广告管理</div>
        <div id="tool-list-ad"></div>
      </div>
    </nav>

    <!-- Main -->
    <div class="main">
      <div class="panel" id="panel">
        <div class="empty-panel">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect x="6" y="8" width="28" height="24" rx="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 16h16M12 20h12M12 24h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <p>从左侧选择工具开始使用</p>
        </div>
      </div>

      <!-- Terminal -->
      <div class="terminal">
        <div class="terminal-bar">
          <div class="terminal-dots">
            <div class="terminal-dot dot-r"></div>
            <div class="terminal-dot dot-y"></div>
            <div class="terminal-dot dot-g"></div>
          </div>
          <span class="terminal-title">输出日志</span>
          <button class="terminal-clear" onclick="clearLog()">清空</button>
        </div>
        <div class="terminal-body" id="term">
          <div class="welcome-msg">— Amazon Toolkit <span>已就绪</span> · 选择工具并点击运行 —</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const TOOL_ORDER = {
  weekly: ['weekly_data_clean', 'weekly_report_append'],
  ad:     ['ad_bulk_update'],
};

let tools = {};
let currentTool = null;
let running = false;
let eventSource = null;

function fmtSize(b) {
  if (b < 1024) return b + 'B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + 'KB';
  return (b/1024/1024).toFixed(1) + 'MB';
}

function ts() {
  return new Date().toTimeString().slice(0,8);
}

function logLine(msg, cls='') {
  const term = document.getElementById('term');
  const welcome = term.querySelector('.welcome-msg');
  if (welcome) welcome.remove();
  const line = document.createElement('div');
  line.className = 'log-line';
  let msgClass = 'log-msg';
  if (msg.startsWith('✅') || msg.startsWith('✓') || msg.includes('完成') || msg.includes('已保存')) msgClass += ' ok';
  else if (msg.startsWith('❌') || msg.includes('出错') || msg.includes('失败') || msg.includes('不存在')) msgClass += ' err';
  else if (msg.startsWith('⚠') || msg.includes('警告') || msg.includes('跳过') || msg.includes('未匹配')) msgClass += ' warn';
  else if (msg.startsWith('📂') || msg.startsWith('📄') || msg.startsWith('🔍') || msg.startsWith('🗑') || msg.startsWith('📋')) msgClass += ' info';
  if (cls) msgClass += ' ' + cls;
  line.innerHTML = `<span class="log-ts">${ts()}</span><span class="${msgClass}">${escHtml(msg)}</span>`;
  term.appendChild(line);
  term.scrollTop = term.scrollHeight;
}

function clearLog() {
  const term = document.getElementById('term');
  term.innerHTML = '<div class="welcome-msg">— 日志已清空 —</div>';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadTools() {
  const res = await fetch('/api/tools');
  tools = await res.json();
  renderSidebar();
  const first = TOOL_ORDER.weekly[0];
  if (first) selectTool(first);
}

function renderSidebar() {
  const nums = { weekly_data_clean: '01', weekly_report_append: '02', ad_bulk_update: '05' };
  const shorts = {
    weekly_data_clean: 'MSKU → 汇总文件',
    weekly_report_append: '汇总 → 周报主表',
    ad_bulk_update: 'Bulk Sheet 竞价',
  };

  ['weekly','ad'].forEach(group => {
    const el = document.getElementById(`tool-list-${group}`);
    el.innerHTML = '';
    TOOL_ORDER[group].forEach(tid => {
      const t = tools[tid];
      if (!t) return;
      const btn = document.createElement('button');
      btn.className = 'tool-btn';
      btn.id = `btn-${tid}`;
      btn.onclick = () => selectTool(tid);
      btn.innerHTML = `
        <span class="tool-num">${nums[tid]}</span>
        <div class="tool-info">
          <div class="tool-name">${t.name}</div>
          <div class="tool-short">${shorts[tid] || ''}</div>
          ${t.depends ? `<span class="dep-tag">需步骤01</span>` : ''}
        </div>`;
      el.appendChild(btn);
    });
  });
}

async function selectTool(tid) {
  currentTool = tid;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(`btn-${tid}`);
  if (btn) btn.classList.add('active');
  await renderPanel(tid);
}

async function renderPanel(tid) {
  const t = tools[tid];
  const filesRes = await fetch(`/api/files/${tid}`);
  const files = await filesRes.json();

  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="panel-title">${t.name}</div>
    <div class="panel-desc">${t.desc}</div>
    ${t.note ? `
    <div class="note-bar">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.2"/><path d="M7 6v4M7 4.5v.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>${t.note}</span>
    </div>` : ''}

    ${t.params.length ? `
    <div class="section-head">运行参数</div>
    <div class="params-row">
      ${t.params.map(p => `
        <div class="param-group">
          <label class="param-label">${p.label}</label>
          <input class="param-input" id="param-${p.key}" placeholder="${p.placeholder}" autocomplete="off">
        </div>`).join('')}
      <div class="param-group" style="justify-content:flex-end;padding-top:18px;">
        <button class="btn-run" id="run-btn" onclick="runTool()">
          <svg class="run-icon" width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M3 2l8 4.5L3 11V2z"/></svg>
          <div class="spin"></div>
          运行
        </button>
      </div>
    </div>` : `
    <div style="margin-bottom:20px;">
      <button class="btn-run" id="run-btn" onclick="runTool()">
        <svg class="run-icon" width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M3 2l8 4.5L3 11V2z"/></svg>
        <div class="spin"></div>
        运行
      </button>
    </div>`}

    <div class="section-head">文件管理</div>
    <div class="files-grid">
      <div class="file-zone">
        <div class="file-zone-head">
          <span class="file-zone-label">输入文件</span>
          <span style="font-size:11px;color:var(--text-3);">${files.input.length} 个文件</span>
        </div>
        <div class="file-zone-body" id="files-input">
          ${renderFileList(files.input, tid, 'input')}
        </div>
        <div class="upload-drop" id="drop-${tid}" onclick="triggerUpload('${tid}')">
          <input type="file" id="upload-${tid}" multiple onchange="uploadFiles('${tid}', this.files)">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="margin-bottom:4px;display:block;margin:0 auto 4px;"><path d="M7 10V4M4 6l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M2 11h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          点击上传文件
        </div>
      </div>
      <div class="file-zone">
        <div class="file-zone-head">
          <span class="file-zone-label">输出文件</span>
          <span style="font-size:11px;color:var(--text-3);">${files.output.length} 个文件</span>
        </div>
        <div class="file-zone-body" id="files-output">
          ${renderFileList(files.output, tid, 'output')}
        </div>
      </div>
    </div>`;

  setupDrop(tid);
}

function renderFileList(files, tid, zone) {
  if (!files.length) return `<div class="file-empty">暂无文件</div>`;
  return files.map(f => `
    <div class="file-row">
      <span class="file-row-name" title="${f.name}">${f.name}</span>
      <span class="file-row-size">${fmtSize(f.size)}</span>
      ${zone === 'output' ? `
        <button class="file-row-dl" title="下载" onclick="downloadFile('${tid}','${escHtml(f.name)}')">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 2v6M3 6l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M2 10h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>` : `
        <button class="file-row-del" title="删除" onclick="deleteFile('${tid}','${escHtml(f.name)}')">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>`}
    </div>`).join('');
}

function triggerUpload(tid) {
  document.getElementById(`upload-${tid}`).click();
}

function setupDrop(tid) {
  const zone = document.getElementById(`drop-${tid}`);
  if (!zone) return;
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('over');
    uploadFiles(tid, e.dataTransfer.files);
  });
}

async function uploadFiles(tid, fileList) {
  if (!fileList.length) return;
  const fd = new FormData();
  for (const f of fileList) fd.append('files', f);
  logLine(`📤 上传 ${fileList.length} 个文件...`);
  const res = await fetch(`/api/upload/${tid}`, { method: 'POST', body: fd });
  const data = await res.json();
  if (data.saved) {
    data.saved.forEach(n => logLine(`✅ 上传成功: ${n}`));
    await refreshFiles(tid);
  }
}

async function deleteFile(tid, name) {
  const res = await fetch(`/api/delete/${tid}`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ filename: name })
  });
  const data = await res.json();
  if (data.ok) { logLine(`🗑 已删除: ${name}`); await refreshFiles(tid); }
}

function downloadFile(tid, name) {
  window.location.href = `/api/download/${tid}/${encodeURIComponent(name)}`;
}

async function refreshFiles(tid) {
  const res = await fetch(`/api/files/${tid}`);
  const files = await res.json();
  const inp = document.getElementById('files-input');
  const out = document.getElementById('files-output');
  if (inp) inp.innerHTML = renderFileList(files.input, tid, 'input');
  if (out) out.innerHTML = renderFileList(files.output, tid, 'output');
}

async function runTool() {
  if (running || !currentTool) return;
  running = true;

  const btn = document.getElementById('run-btn');
  if (btn) { btn.disabled = true; btn.classList.add('loading'); }

  const params = {};
  const t = tools[currentTool];
  t.params.forEach(p => {
    const el = document.getElementById(`param-${p.key}`);
    if (el) params[p.key] = el.value;
  });

  logLine(`▶ 开始运行: ${t.name}`, 'info');

  if (eventSource) { eventSource.close(); eventSource = null; }

  const res = await fetch(`/api/run/${currentTool}`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(params)
  });
  const { task_id } = await res.json();

  eventSource = new EventSource(`/api/stream/${task_id}`);
  eventSource.onmessage = async (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'log') {
      logLine(data.msg);
    } else if (data.type === 'done') {
      eventSource.close(); eventSource = null;
      if (data.status === 'success') logLine(`✅ 任务完成`, 'ok');
      else logLine(`❌ 任务失败`, 'err');
      running = false;
      if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
      await refreshFiles(currentTool);
    }
  };
  eventSource.onerror = () => {
    logLine('⚠ 连接中断', 'warn');
    eventSource.close(); eventSource = null;
    running = false;
    if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
  };
}

loadTools();
